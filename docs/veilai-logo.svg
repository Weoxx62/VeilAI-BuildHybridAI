<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="veil-bg" x1="18" y1="2" x2="46" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#26262B"/>
      <stop offset="100%" stop-color="#141417"/>
    </linearGradient>
    <linearGradient id="veil-rim" x1="32" y1="2" x2="32" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="veil-cloud" x1="48" y1="16" x2="30" y2="49" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6EE7B7"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="veil-local" x1="16" y1="16" x2="34" y2="49" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F7F6F2"/>
      <stop offset="100%" stop-color="#DAD8D2"/>
    </linearGradient>
    <linearGradient id="veil-shadow" x1="31" y1="31" x2="38" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0C0D10" stop-opacity="0.58"/>
      <stop offset="100%" stop-color="#0C0D10" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="veil-glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(49 46) rotate(135) scale(26)">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="veil-right-clip">
      <polygon points="39.75,16.5 50.25,16.5 36.35,48.5 27.65,48.5"/>
    </clipPath>
  </defs>

  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#veil-bg)"/>
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#veil-glow)"/>
  <rect x="2.75" y="2.75" width="58.5" height="58.5" rx="14.25" stroke="url(#veil-rim)" stroke-width="1.5"/>

  <!-- Filtered Cloud Intelligence Wing -->
  <polygon points="39.75,16.5 50.25,16.5 36.35,48.5 27.65,48.5" fill="url(#veil-cloud)"/>

  <!-- Architectural Fold Shadow on Cloud Wing -->
  <polygon points="24.25,16.5 29.5,16.5 41.2,48.5 34.5,48.5" fill="url(#veil-shadow)" clip-path="url(#veil-right-clip)"/>

  <!-- Front On-Device Privacy Veil Wing -->
  <polygon points="13.75,16.5 24.25,16.5 36.35,48.5 27.65,48.5" fill="url(#veil-local)"/>

  <!-- Subtle Fold Crease Highlight -->
  <polygon points="27.65,48.5 32,37.8 36.35,48.5" fill="#FFFFFF" fill-opacity="0.12"/>
</svg>
